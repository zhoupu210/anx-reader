name: Build Windows ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows ARM64 Release
        env:
          CMAKE_GENERATOR_PLATFORM: ARM64
        run: flutter build windows --release

      - name: Package Build Artifacts
        shell: pwsh
        run: |
          if (Test-Path "build\windows\arm64\runner\Release") {
            $buildPath = "build\windows\arm64\runner\Release\*"
          } elseif (Test-Path "build\windows\runner\Release") {
            $buildPath = "build\windows\runner\Release\*"
          } elseif (Test-Path "build\windows\x64\runner\Release") {
            $buildPath = "build\windows\x64\runner\Release\*"
          } else {
            Write-Error "Could not find build output directory."
            exit 1
          }
          Compress-Archive -Path $buildPath -DestinationPath "Anx-Reader-WinARM64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anx-Reader-WinARM64
          path: Anx-Reader-WinARM64.zip
