name: Build Windows ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop & Precache ARM64 Artifacts
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          # 显式下载 windows-arm64 架构所需的 Engine、gen_snapshot 与 dll
          flutter precache --windows --target-platform=windows-arm64

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows ARM64 Release
        shell: pwsh
        run: |
          # 1. 预先生成工程配置
          flutter build windows --config-only

          # 2. 传入 ARM64 目标平台生成构建树
          cmake -B build/windows/arm64 -S windows -A ARM64 -DFLUTTER_TARGET_PLATFORM=windows-arm64

          # 3. 执行 Release 编译
          cmake --build build/windows/arm64 --config Release

      - name: Package Build Artifacts
        shell: pwsh
        run: |
          if (Test-Path "build\windows\arm64\runner\Release") {
            $buildPath = "build\windows\arm64\runner\Release\*"
          } else {
            Write-Error "找不到输出目录 build\windows\arm64\runner\Release"
            exit 1
          }
          Compress-Archive -Path $buildPath -DestinationPath "Anx-Reader-WinARM64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anx-Reader-WinARM64
          path: Anx-Reader-WinARM64.zip
