name: Build Windows ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Pub Dependencies
        run: flutter pub get

      - name: Run Build Runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows ARM64 Release
        shell: pwsh
        run: |
          # 1. 预先生成 Flutter 的 Windows 构建工程
          flutter build windows --config-only

          # 2. 调用 CMake 针对 ARM64 平台重新配置项目
          cmake -B build/windows/arm64 -S windows -A ARM64

          # 3. 执行 release 编译
          cmake --build build/windows/arm64 --config Release

      - name: Package Build Artifacts
        shell: pwsh
        run: |
          if (Test-Path "build\windows\arm64\runner\Release") {
            $buildPath = "build\windows\arm64\runner\Release\*"
          } else {
            Write-Error "找不到构建产物目录 build\windows\arm64\runner\Release"
            exit 1
          }
          Compress-Archive -Path $buildPath -DestinationPath "Anx-Reader-WinARM64.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Anx-Reader-WinARM64
          path: Anx-Reader-WinARM64.zip
